name: AI Daily News

on:
  schedule:
    # 北京时间 8:00 = UTC 0:00（免费版不保证准时，作为兜底）
    - cron: "0 0 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [daily_trigger]

permissions:
  contents: read
  actions: read

# 同一时刻最多 1 个 run 执行 + 1 个 pending（更多的会被 GitHub 自动取消，
# Actions 面板显示 Cancelled 属正常现象）；pending run 轮到执行时守卫能看到
# 已完成的成功 run 并跳过，消除 dispatch 与兜底 schedule 的双跑竞态
concurrency:
  group: daily-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # 默认 AI 名义预算：4 × 180s + 60/300/900s 等待 = 33 分钟；
    # 另留 27 分钟给抓取 fallback、安装/测试和 Notion 发布。
    # 若增大 AI_TIMEOUT，须同步复核此预算。
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Check duplicate automated run
        id: guard
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python daily_run_guard.py

      - name: Stop duplicate automated run
        if: steps.guard.outputs.skip == 'true'
        run: echo "${{ steps.guard.outputs.reason }}"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        if: steps.guard.outputs.skip != 'true'
        run: python -m pytest tests/ -v

      - name: Run daily news pipeline
        if: steps.guard.outputs.skip != 'true'
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_TEMPERATURE: ${{ secrets.AI_TEMPERATURE }}
          AI_TIMEOUT: ${{ secrets.AI_TIMEOUT }}
          AI_MAX_TOKENS: ${{ secrets.AI_MAX_TOKENS }}
          AI_MAX_INPUT_CHARS: ${{ secrets.AI_MAX_INPUT_CHARS }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          PUSH_KEY: ${{ secrets.PUSH_KEY }}
        run: python main.py
